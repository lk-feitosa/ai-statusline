# ==============================================================================
# ~/.tmux.conf — Otimizado para Agentes de IA (agy, claude, codex) no Windows
# ==============================================================================

# Suporte a TrueColor (24-bit) para manter as cores fiéis no Windows Terminal
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB, Direct"

# Ativar suporte completo ao mouse (clicar em painéis/janelas, redimensionar e scroll)
set -g mouse on

# Histórico amplo para não perder logs extensos de agentes
set -g history-limit 50000

# Reduzir delay da tecla ESC (essencial para TUIs, Vim e agentes no terminal)
set -sg escape-time 10
set -g focus-events on

# Começar numeração de janelas e painéis em 1 (mais ergonômico no teclado)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Dividir painéis com | (horizontal) e - (vertical) mantendo o diretório atual
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Navegar entre painéis rapidamente usando Alt + Setas (sem precisar de Ctrl+b antes)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Recarregar configuração com Ctrl+b r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf recarregado!"

# Barra de status limpa e moderna
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#89b4fa] "
set -g status-left-length 30
set -g status-right "#[fg=#a6adc8]%H:%M #[fg=#89b4fa,bold]%d/%m "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=#313244,fg=#89b4fa,bold] #I:#W "
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
